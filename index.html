<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlexMarket</title>
    <meta name="google-site-verification" content="YOUR_GOOGLE_CODE_HERE" />
    <style>
        body { font-family: -apple-system, sans-serif; background: #0f172a; color: white; margin: 0; padding: 20px; text-align: center; }
        h1 { color: #2dd4bf; font-size: 2.5rem; margin-bottom: 10px; }
        p { color: #94a3b8; }
        .card { background: #1e293b; border-radius: 12px; padding: 20px; margin: 20px auto; max-width: 400px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        button { background: #2dd4bf; color: #0f172a; border: none; padding: 12px 24px; font-weight: bold; border-radius: 8px; cursor: pointer; font-size: 1rem; margin-top: 10px; }
        button:active { opacity: 0.8; }
    </style>
</head>
<body>
    <h1>FlexMarket</h1>
    <p>The easiest place to buy and sell secondhand gear.</p>
    
    <div class="card">
        <h3>Vintage Nike Hoodie</h3>
        <p>Condition: Like New • £25.00</p>
        <button onclick="alert('Item added to cart!')">Buy Now</button>
    </div>
</body>
</html>
